name: CI — Testes Automatizados

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Executar diariamente às 06:00 UTC
    - cron: '0 6 * * *'

jobs:
  # ─── Testes Unitários ───────────────────────────────────────────────
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários com coverage
        run: npm run test:coverage

      - name: Upload de coverage (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload para Codecov (somente quando token presente)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

  # ─── Testes E2E (Playwright) ────────────────────────────────────────
  e2e-tests:
    name: Testes E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npx playwright test --reporter=line
        env:
          CI: true

      - name: Upload de evidências essenciais (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  # ─── Validação de Estrutura ─────────────────────────────────────────
  structure-validation:
    name: Validação de Estrutura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar existência dos arquivos
        run: |
          test -f index.html && echo "✅ index.html existe" || (echo "❌ index.html ausente" && exit 1)
          test -f styles.css && echo "✅ styles.css existe" || (echo "❌ styles.css ausente" && exit 1)
          test -f src/main.js && echo "✅ src/main.js existe" || (echo "❌ src/main.js ausente" && exit 1)
          test -f src/core/config.js && echo "✅ src/core/config.js existe" || (echo "❌ src/core/config.js ausente" && exit 1)
          test -f src/core/storage.js && echo "✅ src/core/storage.js existe" || (echo "❌ src/core/storage.js ausente" && exit 1)
          test -f src/ui/render-core.js && echo "✅ src/ui/render-core.js existe" || (echo "❌ src/ui/render-core.js ausente" && exit 1)
          test -f package.json && echo "✅ package.json existe" || (echo "❌ package.json ausente" && exit 1)

      - name: Validar imports no index.html
        run: |
          grep -q '<link rel="stylesheet" href="styles.css"' index.html && echo "✅ CSS importado" || (echo "❌ CSS não importado" && exit 1)
          grep -q '<script src="src/main.js"' index.html && echo "✅ main.js importado" || (echo "❌ src/main.js não importado" && exit 1)
          grep -q '<script src="src/core/config.js"' index.html && echo "✅ config.js importado" || (echo "❌ src/core/config.js não importado" && exit 1)
          grep -q '<script src="src/core/storage.js"' index.html && echo "✅ storage.js importado" || (echo "❌ src/core/storage.js não importado" && exit 1)
          grep -q '<script src="src/ui/render-core.js"' index.html && echo "✅ render-core.js importado" || (echo "❌ src/ui/render-core.js não importado" && exit 1)

      - name: Validar CSP
        run: |
          grep -q 'Content-Security-Policy' index.html && echo "✅ CSP presente" || (echo "❌ CSP ausente" && exit 1)

      - name: Validar DOMPurify
        run: |
          grep -q 'dompurify' index.html && echo "✅ DOMPurify referenciado" || (echo "❌ DOMPurify ausente" && exit 1)

      - name: Validar prefers-reduced-motion
        run: |
          grep -q 'prefers-reduced-motion' styles.css && echo "✅ Reduced motion presente" || (echo "❌ Reduced motion ausente" && exit 1)

      - name: Validar scripts em src
        run: |
          JS_COUNT=$(find src -type f -name '*.js' | wc -l)
          echo "📊 Arquivos JS em src/: $JS_COUNT"
          if [ "$JS_COUNT" -lt 20 ]; then
            echo "❌ Contagem de módulos abaixo do esperado"
            exit 1
          else
            echo "✅ Estrutura modular OK"
          fi

  # ─── Responsividade (Playwright Script) ─────────────────────────────
  responsive-test:
    name: Teste de Responsividade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar teste de responsividade
        run: node Scripts/responsive-test.mjs

  # ─── Resumo de Status ───────────────────────────────────────────────
  summary:
    name: Resumo
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-tests, e2e-tests, structure-validation, responsive-test]
    steps:
      - name: Gerar resumo
        run: |
          echo "## Status dos Jobs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Structure | ${{ needs.structure-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Responsive | ${{ needs.responsive-test.result }} |" >> $GITHUB_STEP_SUMMARY
